# ==============================================================================
# Bandit Security Scan - Ubuntu
# ==============================================================================
#
# Purpose
# -------
# Bandit is a Python security linter running on Ubuntu GitHub Runner.
#
# This workflow:
#
# ✔ Scans Python code for common security problems
# ✔ Detects insecure patterns
# ✔ Generates a security report
# ✔ Comments results on Pull Requests
# ✔ Never modifies source code automatically
#
# ==============================================================================


name: 🔐 Bandit (Ubuntu)


on:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  schedule:
    - cron: "0 0 * * 0"


permissions:

  contents: read
  pull-requests: write



jobs:

  bandit:

    name: 🔐 Run Bandit Security Scanner (Ubuntu)

    runs-on: ubuntu-latest


    steps:


      - name: Checkout repository
        uses: actions/checkout@v4



      - name: Setup Python 3.14
        uses: actions/setup-python@v5

        with:
          python-version: "3.14"
          cache: pip



      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit



      - name: Run Bandit Security Scan
        id: bandit
        continue-on-error: true

        run: |

          bandit \
            -r . \
            -x venv,.venv,env,node_modules \
            -s B105 \
            -f json \
            -o bandit-ubuntu-report.json



      - name: Upload Bandit Ubuntu Report

        uses: actions/upload-artifact@v4

        with:

          name: bandit-ubuntu-security-report

          path: bandit-ubuntu-report.json



      - name: Display Bandit Summary

        run: |

          echo "🔐 Bandit Ubuntu Security Scan Completed"

          cat bandit-ubuntu-report.json || echo "No report generated"



      - name: Comment Bandit Results

        if: github.event_name == 'pull_request'

        uses: actions/github-script@v7

        with:

          script: |

            const fs = require("fs");


            let report = "No security issues found 🎉";


            if (fs.existsSync("bandit-ubuntu-report.json")) {

              const data = JSON.parse(
                fs.readFileSync(
                  "bandit-ubuntu-report.json",
                  "utf8"
                )
              );


              const issues = data.results || [];


              if (issues.length > 0) {

                report = issues
                  .slice(0, 10)
                  .map(
                    issue =>
                    `- ⚠️ ${issue.test_name}: ${issue.issue_text}`
                  )
                  .join("\n");

              }

            }


            const body = [
              "## 🔐 Bandit Security Scan (Ubuntu)",
              "",
              "Bandit analyzed the Python codebase on Ubuntu Runner.",
              "",
              "### Result",
              "",
              report,
              "",
              "### Information",
              "",
              "- 🐧 Ubuntu GitHub Runner",
              "- 🛡️ Security scan only",
              "- 🚫 No automatic code changes",
              "- 👀 Manual review required",
              "",
              "Generated by:",
              "",
              "- 🔐 Bandit",
              "- 🤖 GitHub Actions",
              "- 🐍 Python Security Analysis"
            ].join("\n");


            github.rest.issues.createComment({

              owner: context.repo.owner,

              repo: context.repo.repo,

              issue_number: context.issue.number,

              body

            });
