# ==============================================================================
# Dependency Review - Ubuntu
# ==============================================================================
#
# Purpose
# -------
# Reviews dependency changes introduced by Pull Requests.
#
# Features
# --------
# ✔ Detects vulnerable dependencies
# ✔ Checks dependency changes
# ✔ Blocks high-risk vulnerabilities
# ✔ Creates a formatted PR security report
# ✔ Uploads security logs as an artifact
#
# This workflow NEVER modifies source code.
#
# ==============================================================================


name: 🔐 Dependency Review Ubuntu



on:

  pull_request:

    types:
      - opened
      - synchronize
      - reopened

    branches:
      - main



permissions:

  contents: read

  pull-requests: write



jobs:


  dependency-review:


    name: 🔐 Dependency Security Review (Ubuntu)


    runs-on: ubuntu-latest


    timeout-minutes: 10



    steps:



      # 📥 Checkout source code

      - name: 📥 Checkout repository

        uses: actions/checkout@v4




      # 🔍 Dependency security analysis

      - name: 🔍 Analyze dependency changes

        id: dependency

        uses: actions/dependency-review-action@v4

        with:

          comment-summary-in-pr: always

          retry-on-snapshot-warnings: true

          fail-on-severity: high




      # 📊 Create security report

      - name: 📊 Generate Dependency Report

        if: always()

        run: |

          echo "# 🔐 Dependency Review Report" > dependency-report.md

          echo "" >> dependency-report.md

          echo "| Component | Status |" >> dependency-report.md

          echo "|---|---|" >> dependency-report.md

          echo "| Runner | 🐧 Ubuntu Latest |" >> dependency-report.md

          echo "| Security Scan | 🔍 Dependency Review |" >> dependency-report.md

          echo "| Vulnerability Level | ⚠️ High severity blocked |" >> dependency-report.md

          echo "| Source Changes | 🚫 Not modified |" >> dependency-report.md

          echo "" >> dependency-report.md

          echo "## Information" >> dependency-report.md

          echo "" >> dependency-report.md

          echo "- Dependency changes were automatically reviewed." >> dependency-report.md

          echo "- High-risk vulnerabilities can block merging." >> dependency-report.md

          echo "- Manual review is recommended before merging." >> dependency-report.md




      # 📦 Upload report artifact

      - name: 📦 Upload Dependency Report

        if: always()

        uses: actions/upload-artifact@v7

        with:

          name: dependency-review-ubuntu-report

          path: dependency-report.md




      # 💬 Comment report on Pull Request

      - name: 💬 Comment Dependency Report

        if: github.event_name == 'pull_request'

        uses: actions/github-script@v7

        with:

          script: |

            const fs = require("fs");


            let report = "No report generated";


            if(fs.existsSync("dependency-report.md")) {

              report = fs.readFileSync(
                "dependency-report.md",
                "utf8"
              );

            }


            github.rest.issues.createComment({

              owner: context.repo.owner,

              repo: context.repo.repo,

              issue_number: context.issue.number,

              body: report

            });
