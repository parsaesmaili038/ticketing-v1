name: Issue Security Lock

on:
  schedule:
    - cron: "27 2 * * *"

  workflow_dispatch:

permissions:
  issues: write

jobs:
  security-lock:
    name: Re-close and Lock Issues
    runs-on: ubuntu-latest

    steps:
      - name: Check closed issues
        uses: actions/github-script@v7
        with:
          script: |
            const now = Date.now();
            const twoDays = 2 * 24 * 60 * 60 * 1000;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "closed",
              per_page: 100
            });

            for (const issue of issues) {
              if (issue.pull_request) continue;

              if (issue.locked) continue;

              const { data: timeline } =
                await github.rest.issues.listEventsForTimeline({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  per_page: 100
                });

              const closeEvents = timeline
                .filter(event => event.event === "closed")
                .sort(
                  (a, b) =>
                    new Date(a.created_at) - new Date(b.created_at)
                );

              if (closeEvents.length === 0) continue;

              const firstClosedAt =
                new Date(closeEvents[0].created_at).getTime();

              const elapsed = now - firstClosedAt;

              if (elapsed < twoDays) continue;

              const message = [
                "🔒 **Issue Secured**",
                "",
                "Hello!",
                "",
                "This Issue has remained closed for more than two days.",
                "",
                "As part of the project's Issue management and security policy, the Issue has been re-closed and locked automatically.",
                "",
                "This action is intended to ensure that closed Issues remain closed and cannot be reopened for further discussion.",
                "",
                "If the reported problem is still relevant, please open a new Issue with the latest information and details.",
                "",
                "🙏 Thank you for your understanding and cooperation."
              ].join("\n");

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: message
              });

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "open"
              });

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed"
              });

              await github.rest.issues.lock({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                lock_reason: "resolved"
              });
            }
