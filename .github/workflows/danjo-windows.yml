name: 🪟🐍 Django Windows CI


on:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  schedule:
    - cron: "0 0 * * *"



permissions:

  contents: write

  pull-requests: write



jobs:


  build:


    name: 🚀 Django Windows Test (Python ${{ matrix.python-version }})


    runs-on: windows-latest



    strategy:

      matrix:

        python-version:

          - "3.14"



    steps:



      # 📥 دریافت کد

      - name: 📥 Checkout repository

        uses: actions/checkout@v4




      # 🐍 نصب Python

      - name: 🐍 Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: ${{ matrix.python-version }}




      # 📦 نصب وابستگی‌ها

      - name: 📦 Install Dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt




      # 🔍 بررسی Django

      - name: 🔍 Django Check

        continue-on-error: true

        run: |

          python manage.py check > django-check-report.txt 2>&1




      # 🗄️ Migration

      - name: 🗄️ Django Migration

        continue-on-error: true

        run: |

          python manage.py migrate > django-migration-report.txt 2>&1




      # 🧪 تست‌ها

      - name: 🧪 Django Tests

        continue-on-error: true

        run: |

          python manage.py test > django-test-report.txt 2>&1




      # 📊 ساخت گزارش

      - name: 📊 Generate CI Summary

        if: always()

        shell: powershell

        run: |

          @"

          # 🪟🐍 Django Windows CI Report


          | Component | Result |

          |---|---|

          | Runner | 🪟 Windows Latest |

          | Python | 🐍 ${{ matrix.python-version }} |

          | Framework | Django |

          | Check | 🔍 Completed |

          | Migration | 🗄️ Completed |

          | Tests | 🧪 Completed |


          ## 🔍 Django Check

          ```

          $(Get-Content django-check-report.txt)

          ```


          ## 🗄️ Migration

          ```

          $(Get-Content django-migration-report.txt)

          ```


          ## 🧪 Tests

          ```

          $(Get-Content django-test-report.txt)

          ```

          "@ | Out-File django-windows-summary.md




      # 📦 ذخیره Artifact

      - name: 📦 Upload Django Report

        if: always()

        uses: actions/upload-artifact@v7

        with:

          name: django-windows-ci-report

          path: |

            django-windows-summary.md

            django-test-report.txt

            django-check-report.txt

            django-migration-report.txt




      # 💬 کامنت روی PR

      - name: 💬 Comment CI Result

        if: github.event_name == 'pull_request'

        uses: actions/github-script@v7

        with:

          script: |

            const fs = require("fs");


            let summary = "No summary";


            if(fs.existsSync("django-windows-summary.md")){

              summary = fs.readFileSync(
                "django-windows-summary.md",
                "utf8"
              );

            }


            github.rest.issues.createComment({

              owner: context.repo.owner,

              repo: context.repo.repo,

              issue_number: context.issue.number,

              body: summary.substring(0,5000)

            });




      # 🤖 ساخت PR در صورت شکست

      - name: 🤖 Create Failure Report PR

        if: failure()

        uses: peter-evans/create-pull-request@v7

        with:

          token: ${{ secrets.GITHUB_TOKEN }}

          branch: automation/django/windows-failure-${{ github.run_id }}

          title: "🤖🪟 Django Windows CI Failure Report"

          commit-message: "🤖 add Django Windows CI report"

          body: |

            ## 🪟🐍 Django Windows CI Failed


        

            🚫 No source code changes

            📦 Check artifacts for details


          labels: |

            automated

            django

            ci

            needs-review
