# ==============================================================================
# # Bandit Security Scan - Windows
# ==============================================================================
#
# Purpose
# -------
# This workflow runs Bandit security analysis on an windows GitHub Runner.
#
# Features:
#
# ✔ Scans Python code for security issues
# ✔ Generates a JSON security report
# ✔ Uploads the security report as an artifact
# ✔ Creates a Pull Request containing only the report
# ✔ Comments security results on existing Pull Requests
#
# Important:
#
# • This workflow does NOT modify source code.
# • This workflow does NOT apply automatic security fixes.
# • Generated Pull Requests contain reports only.
#
# ==============================================================================


name: 🔐 Bandit (Windows)



# ==============================================================================
# Workflow Triggers
# ==============================================================================
#
# Runs when:
#
# • Code is pushed to main
# • A Pull Request targets main
# • Weekly scheduled security scan
#
# ==============================================================================

on:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  schedule:
    - cron: "0 0 * * 0"



# ==============================================================================
# Permissions
# ==============================================================================
#
# contents: write
# Allows creating branches and commits for report-only Pull Requests.
#
# pull-requests: write
# Allows creating and updating Pull Requests.
#
# ==============================================================================

permissions:

  contents: write
  pull-requests: write



# ==============================================================================
# Jobs
# ==============================================================================

jobs:


  bandit:


# Security scanner running on Windows environment
    name: 🔐 Run Bandit Security Scanner (Windows)


    runs-on:  windows-latest



    steps:


      # ------------------------------------------------------------------------
      # Download repository source code
      # ------------------------------------------------------------------------

      - name: Checkout repository

        uses: actions/checkout@v4

        with:

          fetch-depth: 0



      # ------------------------------------------------------------------------
      # Install Python environment
      # ------------------------------------------------------------------------

      - name: Setup Python 3.14

        uses: actions/setup-python@v5

        with:

          python-version: "3.14"

          cache: pip



      # ------------------------------------------------------------------------
      # Install Bandit security scanner
      # ------------------------------------------------------------------------

      - name: Install Bandit

        run: |

          python -m pip install --upgrade pip

          pip install bandit



      # ------------------------------------------------------------------------
      # Run Security Scan
      # ------------------------------------------------------------------------
      #
      # Bandit analyzes the repository and creates:
      #
      # bandit-windows-report.json
      #
      # The report is used to detect security findings.
      #
      # No source files are modified.
      #
      # ------------------------------------------------------------------------

      - name: Run Bandit Security Scan

        id: bandit

        continue-on-error: true

        run: |
          bandit `
            -r . `
            -x venv,.venv,env,node_modules `
            -s B105 `
            -f json `
            -o bandit-windows-report.json



          

          python -c "
          import json
          import os

          with open('bandit-windows-report.json') as f:
              data = json.load(f)

          issues = len(data.get('results', []))

          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'issues={str(issues > 0).lower()}\n')

          print(f'Bandit found {issues} issue(s)')
          "



      # ------------------------------------------------------------------------
      # Store Security Report
      # ------------------------------------------------------------------------
      #
      # Keeps the Bandit report available from GitHub Actions artifacts.
      #
      # ------------------------------------------------------------------------

      - name: Upload Bandit Windows Report

        uses: actions/upload-artifact@v4

        with:

          name: bandit-windows-security-report


          path: bandit-windows-report.json



      # ------------------------------------------------------------------------
      # Display Scan Result
      # ------------------------------------------------------------------------

      - name: Display Bandit Summary

        run: |

          echo "🔐 Bandit Windows Security Scan Completed"

          Get-Content bandit-windows-report.json || echo "No report generated"



      # ------------------------------------------------------------------------
      # Create Pull Request
      # ------------------------------------------------------------------------
      #
      # Only runs when security issues are detected.
      #
      # The Pull Request contains:
      #
      # ✔ Security report
      # ✖ No source code changes
      #
      # ------------------------------------------------------------------------
      - name: Prepare Bandit Report For Pull Request

        if: steps.bandit.outputs.issues == 'true'

        run: |

          git add bandit-windows-report.json

          git commit -m "🤖🔐 security(bandit): add security report" || echo "No changes"



      - name: Create Pull Request with Report

        if: steps.bandit.outputs.issues == 'true'

        uses: peter-evans/create-pull-request@v7

        with:

          token: ${{ secrets.GITHUB_TOKEN }}

          branch: automation/bandit/${{ github.run_id }}

          base: main

          delete-branch: true

          draft: false



          commit-message: |

            🤖🔐 security(bandit): add security report



          title: |

            🤖🔐 Automated Bandit Security Report



          body: |

            ## 🔐 Automated Bandit Security Report


            Bandit detected potential security issues.


            This Pull Request contains:

            - ✅ Security report only
            - 🚫 No source code modifications
            - 👀 Manual review required



          labels: |

            automated

            bandit

            security

            needs-review



      # ------------------------------------------------------------------------
      # Comment Results on Existing Pull Requests
      # ------------------------------------------------------------------------
      #
      # Adds Bandit findings as a comment.
      #
      # Does not create changes.
      #
      # ------------------------------------------------------------------------

      - name: Comment Bandit Results

        if: github.event_name == 'pull_request'

        uses: actions/github-script@v7


        with:

            script: |

              const fs = require("fs");


              if (!fs.existsSync("bandit-windows-report.json")) {

                return;

              }


              const data = JSON.parse(

                fs.readFileSync(

                  "bandit-windows-report.json",

                  "utf8"

                )

              );


              const issues = data.results || [];


              const report = issues.length === 0

                ? "No security issues found 🎉"

                : issues

                  .slice(0, 10)

                  .map(

                    issue =>

                    `- ⚠️ ${issue.test_name}: ${issue.issue_text}`

                  )

                  .join("\n");


              const body = [
                "## 🔐 Bandit Security Scan (Windows)",
                "",
                "### Result",
                "",
                report,
                "",
                "### Information",
                "",
                "- 🪟 windows GitHub Runner",
                "- 🛡️ Security scan only",
                "- 🚫 No automatic code changes",
                "- 👀 Manual review required"
              ].join("\n");


              github.rest.issues.createComment({

                owner: context.repo.owner,

                repo: context.repo.repo,

                issue_number: context.issue.number,

                body: body

              });
