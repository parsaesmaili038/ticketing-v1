name: 🐧🐍 Django CI Ubuntu


on:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  schedule:
    - cron: "0 0 * * *"



permissions:

  contents: read

  pull-requests: write



jobs:


  django-test:


    name: 🚀 Django Ubuntu Test - Python ${{ matrix.python-version }}


    runs-on: ubuntu-latest



    strategy:

      matrix:

        python-version:

          - "3.14"



    steps:


      # 📥 دریافت پروژه

      - name: 📥 Checkout repository

        uses: actions/checkout@v4



      # 🐍 نصب Python

      - name: 🐍 Setup Python ${{ matrix.python-version }}

        uses: actions/setup-python@v7

        with:

          python-version: ${{ matrix.python-version }}



      # 📦 نصب وابستگی‌ها

      - name: 📦 Install Dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt



      # 🔍 بررسی تنظیمات Django

      - name: 🔍 Django Ubuntu Configuration Check

        run: |

          python manage.py check



      # 🗄️ Migration Test

      - name: 🗄️ Django Ubuntu Migration Check

        run: |

          python manage.py migrate --noinput



      # 🧪 تست Django

      - name: 🧪 Run Django Ubuntu Tests

        continue-on-error: true

        run: |

          python manage.py test > django-ubuntu-test-report.txt 2>&1



      # 📦 ذخیره گزارش

      - name: 📦 Upload Django Ubuntu Artifact

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: django-ubuntu-test-report-python-${{ matrix.python-version }}

          path: django-ubuntu-test-report.txt



      # 💬 کامنت روی Pull Request

      - name: 💬 Comment Django Ubuntu Result

        if: github.event_name == 'pull_request'

        uses: actions/github-script@v7

        with:

          script: |

            const fs = require("fs");


            let report = "No report generated";


            if (fs.existsSync("django-ubuntu-test-report.txt")) {

              report = fs.readFileSync(
                "django-ubuntu-test-report.txt",
                "utf8"
              );

            }


            const body = [
              "## 🐧🐍 Django Ubuntu CI Report",
              "",
              "| Component | Status |",
              "|---|---|",
              "| Runner | 🐧 Ubuntu Latest |",
              "| Python | 🐍 ${{ matrix.python-version }} |",
              "| Django Check | ✅ Completed |",
              "| Migration | 🗄️ Completed |",
              "| Tests | 🧪 Completed |",
              "",
              "### Test Output",
              "",
              "```",
              report.substring(0,3000),
              "```",
              "",
              "📦 Full logs are available in GitHub Actions Artifact."
            ].join("\n");


            github.rest.issues.createComment({

              owner: context.repo.owner,

              repo: context.repo.repo,

              issue_number: context.issue.number,

              body: body

            });
